<svg xmlns="http://www.w3.org/2000/svg" width="420" height="210" viewBox="0 0 420 210" fill="none">
  <defs>
    <linearGradient id="card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1420"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="laravel-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF2D20" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FF2D20" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="odoo-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A24689" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#714B67" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <style>
    .card { fill: url(#card-bg); stroke: #30363d; stroke-width: 1.2; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #38bdf8; letter-spacing: 0.6px; }
    .badge-laravel { fill: url(#laravel-grad); stroke: #FF2D20; stroke-opacity: 0.35; stroke-width: 1; }
    .badge-odoo { fill: url(#odoo-grad); stroke: #A24689; stroke-opacity: 0.35; stroke-width: 1; }
    .tech-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #f1f5f9; }
    .tech-role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 400; fill: #94a3b8; }
    .footer-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 500; fill: #64748b; }
  </style>

  <!-- Card Background -->
  <rect class="card" x="1" y="1" width="418" height="208" rx="12"/>

